<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chelsea Tactical Board — Drawing Prototype</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#172235;color:#fff;font-family:Arial,sans-serif}
#app{min-height:100vh;display:flex;flex-direction:column}
#toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 18px;background:#202e41;border-bottom:1px solid #ffffff18}
button,input,select{font:inherit}
button{border:0;border-radius:7px;padding:8px 12px;background:#2d78f4;color:white;font-weight:700;cursor:pointer}
button:hover{filter:brightness(1.1)}
button.active{outline:2px solid #fff;box-shadow:0 0 0 3px #2d78f455}
button.secondary{background:#33445d}
button.danger{background:#d94a4a}
#toolbar input,#toolbar select{background:#fff;color:#172235;border:0;border-radius:7px;padding:8px 9px}
#hint{margin-left:auto;color:#b9c8dd;font-size:13px}
#workspace{display:flex;justify-content:center;padding:22px}
#pitchWrap{position:relative;width:min(1150px,94vw);aspect-ratio:1150/730}
#pitch{
  position:absolute;inset:0;overflow:hidden;border:3px solid white;border-radius:18px;
  background:
    repeating-linear-gradient(90deg,#178c45 0,#178c45 8.695%,#19964b 8.695%,#19964b 17.39%);
  box-shadow:0 10px 40px #0006;
}
#pitch::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:#fff;transform:translateX(-50%)}
#pitch::after{content:"";position:absolute;left:50%;top:50%;width:145px;height:145px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%)}
.markings{position:absolute;inset:0;pointer-events:none}
.box{position:absolute;top:24%;height:52%;width:16%;border:2px solid #fff}
.box.left{left:0;border-left:0}.box.right{right:0;border-right:0}
.six{position:absolute;top:36%;height:28%;width:7%;border:2px solid #fff}
.six.left{left:0;border-left:0}.six.right{right:0;border-right:0}
#svg{position:absolute;inset:0;width:100%;height:100%;z-index:5;overflow:visible}
#players{position:absolute;inset:0;z-index:10}
.player{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:grab;user-select:none}
.player:active{cursor:grabbing}
.playerName{font-weight:800;font-size:13px;text-shadow:0 2px 5px #000;margin-bottom:3px;white-space:nowrap}
.playerCircle{width:38px;height:38px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-weight:900;box-shadow:0 3px 10px #0007}
.player.opp .playerCircle{background:#d64b4b}
.player.chelsea .playerCircle{background:#2878ee}
#landing{min-height:100vh;background:#172235;display:flex;justify-content:center;align-items:flex-start;padding:55px 20px}
#landingCard{width:min(900px,95vw);background:#202e41;border-radius:18px;padding:30px;box-shadow:0 15px 50px #0006}
#landingHeader{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}
#landingHeader h1{margin:0;font-size:28px}
.matchList{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.matchCard{background:#2a3b54;border:1px solid #ffffff12;border-radius:12px;padding:16px;cursor:pointer}
.matchCard:hover{background:#334761}
.matchTitle{font-size:18px;font-weight:800}.matchMeta{color:#b9c8dd;font-size:13px;margin-top:6px}
.matchActions{margin-top:13px;display:flex;gap:7px}
#boardShell{display:none;min-height:100vh}
#notesPanel{width:min(330px,27vw);min-width:250px;background:#202e41;border-radius:12px;padding:16px;box-shadow:0 8px 25px #0004}
#notesPanel h3{margin:0 0 10px}.noteItem{padding:10px;border-radius:8px;background:#2a3b54;margin-bottom:8px;border-left:3px solid #ffe16a}
.noteItem small{display:block;color:#aebed3;margin-top:4px}
#workspace{gap:18px;align-items:flex-start}
#sceneBar{display:flex;gap:8px;align-items:center;overflow-x:auto;padding:10px 18px;background:#1c293d;border-bottom:1px solid #ffffff12;min-height:58px}
.sceneCard{min-width:175px;padding:10px 12px;border-radius:10px;background:#2b3b54;color:#dbe7f7;cursor:pointer;border:1px solid transparent;box-shadow:0 3px 10px #0003}
.sceneCard:hover{background:#334761}
.sceneCard.active{border-color:#fff;background:#3566a8}
.sceneTitle{font-weight:800;font-size:13px}.sceneMeta{font-size:11px;color:#b9c8dd;margin-top:3px}
.sceneDelete{float:right;background:none;padding:0 2px;color:#ff9b9b;font-size:13px}
#status{padding:0 22px 16px;color:#aebed3;font-size:13px;text-align:center}
.arrow{fill:none;stroke-width:4;cursor:pointer;pointer-events:stroke}
.arrow.pass{stroke:#fff}
.arrow.run{stroke:#ffe16a;stroke-dasharray:10 8}
.arrow.selected{stroke-width:6}
.arrowHead{pointer-events:none}
.zoneShape{fill:#ffe16a22;stroke:#ffe16a;stroke-width:2;cursor:pointer}
.zoneShape.selected{stroke-width:4}
.tacticLine{stroke:#ff6b6b;stroke-width:4;stroke-dasharray:12 8;cursor:pointer}
.tacticLine.selected{stroke-width:6}
.noteBox{fill:#172235dd;stroke:#ffe16a;stroke-width:2;cursor:pointer}
.noteText{fill:#fff;font-size:14px;font-weight:700;pointer-events:none}
.emptyNote{color:#9fb0c7}
</style>
</head>
<body>
<div id="app">
  <div id="landing">
    <div id="landingCard">
      <div id="landingHeader">
        <div><h1>Chelsea Tactical Analysis</h1><div style="color:#aebed3;margin-top:5px">Your matches and tactical briefings</div></div>
        <button onclick="createMatch()">+ Add match</button>
      </div>
      <div id="matchList" class="matchList"></div>
    </div>
  </div>

  <div id="boardShell">
  <div id="toolbar">
    <strong style="margin-right:8px">TACTICAL BOARD</strong>
    <button id="selectBtn" class="active" onclick="setTool('select')">Select</button>
    <button id="passBtn" onclick="setTool('pass')">Pass</button>
    <button id="runBtn" onclick="setTool('run')">Run</button>
    <button id="zoneBtn" onclick="setTool('zone')">Zone</button>
    <button id="lineBtn" onclick="setTool('line')">Line</button>
    <button id="noteBtn" onclick="setTool('note')">Note</button>
    <button class="secondary" onclick="undo()">Undo</button>
    <button class="danger" onclick="clearArrows()">Clear arrows</button>
    <span style="width:1px;height:28px;background:#ffffff22;margin:0 4px"></span>
    <input id="playerName" placeholder="Player">
    <select id="playerTeam"><option value="chelsea">Chelsea</option><option value="opp">Opponent</option></select>
    <button onclick="addPlayer()">Add player</button>
    <span id="hint">Select: move players • Pass/Run: drag on the pitch • Click an arrow to select</span>
  </div>

  <div id="sceneBar"></div>
  <div id="workspace">
    <div id="pitchWrap">
      <div id="pitch">
        <div class="markings">
          <div class="box left"></div><div class="box right"></div>
          <div class="six left"></div><div class="six right"></div>
        </div>
        <svg id="svg">
          <defs>
            <marker id="whiteHead" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
              <path d="M0,0 L8,3.5 L0,7 Z" fill="#fff"></path>
            </marker>
            <marker id="yellowHead" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
              <path d="M0,0 L8,3.5 L0,7 Z" fill="#ffe16a"></path>
            </marker>
          </defs>
          <g id="zones"></g><g id="lines"></g><g id="notes"></g><g id="arrows"></g>
          <line id="preview" x1="0" y1="0" x2="0" y2="0" style="display:none"></line>
        </svg>
        <div id="players"></div>
      </div>
    </div>
    <aside id="notesPanel">
      <h3>Briefing Notes</h3>
      <div id="notesList"><div class="emptyNote">No notes yet.</div></div>
      <button class="secondary" style="width:100%;margin-top:6px" onclick="addPanelNote()">+ Add note</button>
    </aside>
  </div>
  <div id="status">Each briefing stores its own tactical snapshot. Notes live outside the pitch so the diagram stays clean. <span id="saveStatus"></span></div>
  </div>
</div>

<script>
let nextPlayerId=1, nextObjectId=1;
let players=[], arrows=[], zones=[], lines=[], notes=[];
let selectedObject=null, tool='select', drawing=false, start=null;
const pitch=document.getElementById('pitch');
const playersLayer=document.getElementById('players');
const arrowsLayer=document.getElementById('arrows');
const zonesLayer=document.getElementById('zones');
const linesLayer=document.getElementById('lines');
const notesLayer=document.getElementById('notes');
const preview=document.getElementById('preview');


let scenes=[], currentSceneId=null, matchMeta={name:'',date:'',minute:''};
let matches=[], currentMatchId=null;


function loadMatchesLibrary(){
  try{matches=JSON.parse(localStorage.getItem('chelseaMatches')||'[]')}catch{matches=[]}
  renderMatchList();
}
function persistMatches(){
  localStorage.setItem('chelseaMatches',JSON.stringify(matches));
}
function createMatch(){
  const name=prompt('Match name (e.g. Chelsea vs Arsenal):');
  if(!name || !name.trim()) return;

  const id=Date.now();
  const match={
    id:id,
    name:name.trim(),
    date:'',
    briefings:[]
  };

  matches.unshift(match);
  persistMatches();

  // Enter the board directly.
  currentMatchId=id;
  matchMeta={name:match.name,date:'',minute:''};
  scenes=[];
  currentSceneId=null;

  document.getElementById('landing').style.display='none';
  document.getElementById('boardShell').style.display='block';

  // Create the first briefing without relying on the previous match state.
  createFirstBriefing();
  renderMatchList();
}
function createFirstBriefing(){
  const id=Date.now()+1;
  const briefing={
    id:id,
    title:'Briefing 1',
    phase:'Starting shape',
    match:{...matchMeta},
    players:[],
    arrows:[],
    zones:[],
    lines:[],
    notes:[]
  };

  scenes=[briefing];
  currentSceneId=id;

  restoreScene(briefing);
  renderSceneBar();
  saveCurrentMatchToLibrary();
}

function saveCurrentMatchToLibrary(){
  if(currentMatchId===null) return;
  const m=matches.find(x=>x.id===currentMatchId);
  if(!m) return;

  m.name=matchMeta.name || m.name;
  m.date=matchMeta.date || '';
  m.briefings=structuredClone(scenes);
  persistMatches();
}

function openMatch(id){
  const m=matches.find(x=>x.id===id);
  if(!m)return;

  currentMatchId=id;
  matchMeta={name:m.name,date:m.date||'',minute:''};

  document.getElementById('landing').style.display='none';
  document.getElementById('boardShell').style.display='block';

  if(!m.briefings || m.briefings.length===0){
    createFirstBriefing();
  }else{
    scenes=structuredClone(m.briefings);
    currentSceneId=scenes[0].id;
    restoreScene(scenes[0]);
    renderSceneBar();
  }

  renderMatchHeader();
}
function renderMatchList(){
  const list=document.getElementById('matchList'); list.innerHTML='';
  if(!matches.length){
    list.innerHTML='<div class="emptyNote">No matches yet. Click “+ Add match” to begin.</div>';return;
  }
  matches.forEach(m=>{
    const card=document.createElement('div');card.className='matchCard';
    card.innerHTML=`<div class="matchTitle">${escapeHtml(m.name)}</div>
      <div class="matchMeta">${m.briefings.length} briefing${m.briefings.length===1?'':'s'}${m.date?' • '+escapeHtml(m.date):''}</div>
      <div class="matchActions">
        <button>Open</button><button class="danger">Delete</button>
      </div>`;
    card.querySelector('button').onclick=e=>{e.stopPropagation();openMatch(m.id)};
    card.querySelector('.danger').onclick=e=>{
      e.stopPropagation();
      if(confirm('Delete this match and all its briefings?')){
        matches=matches.filter(x=>x.id!==m.id);persistMatches();renderMatchList();
      }
    };
    card.onclick=()=>openMatch(m.id);
    list.appendChild(card);
  });
}
function renderMatchHeader(){
  document.getElementById('matchName').value=matchMeta.name||'';
  document.getElementById('matchDate').value=matchMeta.date||'';
}
function backToMatch(){
  syncCurrentMatch();
  persistMatches();
  document.getElementById('boardShell').style.display='none';
  document.getElementById('landing').style.display='flex';
  loadMatchesLibrary();
}
function syncCurrentMatch(){
  if(currentMatchId===null)return;
  if(currentSceneId!==null) snapshotCurrentScene();
  saveCurrentMatchToLibrary();
}
function addPanelNote(){
  const text=prompt('Briefing note:');
  if(!text||!text.trim())return;
  notes.push({id:nextObjectId++,x:.5,y:.5,text:text.trim()});
  renderAll();saveLocal();
}
function snapshotCurrentScene(){
  if(currentSceneId===null) return;
  const s=scenes.find(x=>x.id===currentSceneId);
  if(!s)return;
  s.match={...matchMeta};
  s.phase=document.getElementById('phaseSelect').value;
  s.players=structuredClone(players);
  s.arrows=structuredClone(arrows);
  s.zones=structuredClone(zones);
  s.lines=structuredClone(lines);
  s.notes=structuredClone(notes);
}

function restoreScene(s){
  if(!s)return;
  players=structuredClone(s.players||[]);
  arrows=structuredClone(s.arrows||[]);
  zones=structuredClone(s.zones||[]);
  lines=structuredClone(s.lines||[]);
  notes=structuredClone(s.notes||[]);
  matchMeta={...(s.match||{})};
  document.getElementById('matchName').value=matchMeta.name||'';
  document.getElementById('matchDate').value=matchMeta.date||'';
  document.getElementById('matchMinute').value=matchMeta.minute||'';
  document.getElementById('phaseSelect').value=s.phase||'Starting shape';
  selectedObject=null;
  renderPlayers();renderAll();
}

function newScene(){
  snapshotCurrentScene();
  const id=Date.now();
  const title=document.getElementById('matchName').value.trim() ? `Scene ${scenes.length+1}` : `Scene ${scenes.length+1}`;
  scenes.push({
    id,title,phase:document.getElementById('phaseSelect').value,
    match:{...matchMeta},players:structuredClone(players),arrows:structuredClone(arrows),
    zones:structuredClone(zones),lines:structuredClone(lines),notes:structuredClone(notes)
  });
  currentSceneId=id;
  renderSceneBar();
  saveLocal();
  saveCurrentMatchToLibrary();
}

function selectScene(id){
  snapshotCurrentScene();
  const s=scenes.find(x=>x.id===id);
  if(!s)return;
  currentSceneId=id;
  restoreScene(s);
  renderSceneBar();saveLocal();
}

function renameBriefing(){
  if(currentSceneId===null)return;
  const s=scenes.find(x=>x.id===currentSceneId);
  if(!s)return;
  const title=prompt('Briefing name:',s.title||'Briefing');
  if(title===null)return;
  s.title=title.trim()||s.title;
  renderSceneBar();
  saveLocal();
  saveCurrentMatchToLibrary();
}

function duplicateScene(id){
  const original=scenes.find(x=>x.id===id);
  if(!original)return;
  const title=prompt('Name for duplicated briefing:',`${original.title} copy`);
  if(title===null)return;
  const copy=structuredClone(original);
  copy.id=Date.now();
  copy.title=title.trim()||`${original.title} copy`;
  scenes.push(copy);
  currentSceneId=copy.id;
  restoreScene(copy);
  renderSceneBar();
  saveLocal();
  saveCurrentMatchToLibrary();
}

function deleteScene(id){
  if(scenes.length<=1)return;
  scenes=scenes.filter(s=>s.id!==id);
  currentSceneId=scenes[0].id;
  restoreScene(scenes[0]);renderSceneBar();saveLocal();
}

function renderSceneBar(){
  const bar=document.getElementById('sceneBar');
  bar.innerHTML='';
  scenes.forEach((s,i)=>{
    const card=document.createElement('div');
    card.className='sceneCard'+(s.id===currentSceneId?' active':'');
    card.innerHTML=`<button class="sceneDelete" title="Delete scene">×</button>
      <div class="sceneTitle">${escapeHtml(s.title||`Scene ${i+1}`)}</div>
      <div class="sceneMeta">${escapeHtml(s.phase||'Other')} • ${escapeHtml(s.match?.minute||'—')}</div>`;
    card.addEventListener('click',()=>selectScene(s.id));
    card.querySelector('.sceneDelete').addEventListener('click',e=>{e.stopPropagation();deleteScene(s.id)});
    card.addEventListener('contextmenu',e=>{e.preventDefault();duplicateScene(s.id)});
    bar.appendChild(card);
  });
}

function saveMatch(){
  syncCurrentMatch();
  persistMatches();
  const status=document.getElementById('saveStatus');
  if(status){
    status.textContent=' • Saved';
    clearTimeout(window._saveTimer);
    window._saveTimer=setTimeout(()=>status.textContent='',1800);
  }
}

function setTool(next){
  tool=next;
  document.querySelectorAll('#toolbar button').forEach(b=>b.classList.remove('active'));
  const id={select:'selectBtn',pass:'passBtn',run:'runBtn',zone:'zoneBtn',line:'lineBtn',note:'noteBtn'}[next];
  document.getElementById(id).classList.add('active');
  document.getElementById('hint').textContent =
    next==='select' ? 'Select: move players • click a marking to select • Delete removes it'
    : next==='note' ? 'Note: click the pitch to add a tactical observation'
    : next==='zone' ? 'Zone: drag an area • release to create a highlighted tactical zone'
    : next==='line' ? 'Line: drag across the pitch • release to create a tactical line'
    : `${next==='pass'?'Pass':'Run'}: drag from the start point to the end point • release to create`;
}

function posFromEvent(e){
  const r=pitch.getBoundingClientRect();
  return {
    x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),
    y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))
  };
}
function toPx(p){return {x:p.x*pitch.clientWidth,y:p.y*pitch.clientHeight}}

function addPlayer(data){
  const p=data||{
    id:nextPlayerId++,name:document.getElementById('playerName').value.trim()||'Player',
    team:document.getElementById('playerTeam').value,x:.5+Math.random()*.35,y:.2+Math.random()*.6
  };
  if(data) nextPlayerId=Math.max(nextPlayerId,p.id+1);
  players.push(p); renderPlayers();
  document.getElementById('playerName').value='';
}

function renderPlayers(){
  playersLayer.innerHTML='';
  players.forEach(p=>{
    const el=document.createElement('div');
    el.className=`player ${p.team}`;
    el.dataset.id=p.id;
    el.style.left=(p.x*100)+'%'; el.style.top=(p.y*100)+'%';
    el.innerHTML=`<div class="playerName">${escapeHtml(p.name)}</div><div class="playerCircle">${p.team==='chelsea'?'C':'O'}</div>`;
    el.addEventListener('pointerdown',e=>{
      if(tool!=='select') return;
      e.stopPropagation();
      dragPlayer(e,p,el);
    });
    playersLayer.appendChild(el);
  });
}
function dragPlayer(e,p,el){
  el.setPointerCapture?.(e.pointerId);
  const move=ev=>{const q=posFromEvent(ev);p.x=q.x;p.y=q.y;el.style.left=q.x*100+'%';el.style.top=q.y*100+'%';renderArrows()};
  const up=()=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);saveLocal()};
  el.addEventListener('pointermove',move);el.addEventListener('pointerup',up);
}

pitch.addEventListener('pointerdown',e=>{
  if(tool==='select') return;
  if(e.target.closest('.player') || e.target.closest('.arrow') ||
     e.target.closest('.zoneShape') || e.target.closest('.tacticLine') ||
     e.target.closest('.noteBox')) return;

  const p=posFromEvent(e);

  if(tool==='note'){
    const text=prompt('Tactical note:');
    if(text && text.trim()){
      notes.push({id:nextObjectId++,x:p.x,y:p.y,text:text.trim()});
      renderAll(); saveLocal();
    }
    return;
  }

  drawing=true; start=p;
  const s=toPx(start);
  preview.style.display='block';
  preview.setAttribute('x1',s.x); preview.setAttribute('y1',s.y);
  preview.setAttribute('x2',s.x); preview.setAttribute('y2',s.y);
  preview.setAttribute('stroke',tool==='pass'?'#fff':tool==='run'?'#ffe16a':tool==='zone'?'#ffe16a':'#ff6b6b');
  preview.setAttribute('stroke-width','4');
  preview.setAttribute('stroke-dasharray',tool==='run'||tool==='line'?'10 8':'');
  preview.setAttribute('marker-end',(tool==='pass'||tool==='run')?(tool==='pass'?'url(#whiteHead)':'url(#yellowHead)'):'');
});
pitch.addEventListener('pointermove',e=>{
  if(!drawing)return;
  const q=posFromEvent(e),a=toPx(start),b=toPx(q);
  if(tool==='zone'){
    preview.setAttribute('x1',Math.min(a.x,b.x)); preview.setAttribute('y1',Math.min(a.y,b.y));
    preview.setAttribute('x2',Math.max(a.x,b.x)); preview.setAttribute('y2',Math.max(a.y,b.y));
  }else{
    preview.setAttribute('x2',b.x); preview.setAttribute('y2',b.y);
  }
});
pitch.addEventListener('pointerup',e=>{
  if(!drawing)return;
  drawing=false;
  const end=posFromEvent(e);
  preview.style.display='none';

  if(Math.hypot(end.x-start.x,end.y-start.y)<=.025) return;

  if(tool==='pass'||tool==='run'){
    arrows.push({id:nextObjectId++,type:tool,start:{...start},end:{...end}});
  }else if(tool==='zone'){
    zones.push({
      id:nextObjectId++,
      x:Math.min(start.x,end.x), y:Math.min(start.y,end.y),
      width:Math.abs(end.x-start.x), height:Math.abs(end.y-start.y),
      label:'Zone'
    });
  }else if(tool==='line'){
    lines.push({id:nextObjectId++,start:{...start},end:{...end}});
  }
  selectedObject=null; renderAll(); saveLocal();
});

function renderAll(){renderArrows();renderZones();renderLines();renderNotes();renderNotesPanel()}
function renderNotesPanel(){
  const list=document.getElementById('notesList'); if(!list)return;
  list.innerHTML='';
  if(!notes.length){
    list.innerHTML='<div class="emptyNote">No notes yet. Add observations here while reviewing the match.</div>';
    return;
  }
  notes.forEach(n=>{
    const item=document.createElement('div');item.className='noteItem';
    item.innerHTML=`<div style="display:flex;gap:8px;align-items:flex-start">
      <span style="flex:1">${escapeHtml(n.text)}</span>
      <button class="danger" style="padding:2px 6px;font-size:11px">×</button>
      </div><small>Briefing observation</small>`;
    item.querySelector('button').onclick=e=>{
      e.stopPropagation();
      notes=notes.filter(x=>x.id!==n.id);
      selectedObject=null;
      renderAll();saveLocal();
    };
    item.onclick=()=>{selectedObject=n.id;renderAll()};
    list.appendChild(item);
  });
}
function renderArrows(){
  arrowsLayer.innerHTML='';
  arrows.forEach(a=>{
    const s=toPx(a.start),e=toPx(a.end);
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',s.x);line.setAttribute('y1',s.y);line.setAttribute('x2',e.x);line.setAttribute('y2',e.y);
    line.setAttribute('class',`arrow ${a.type} ${selectedObject===a.id?'selected':''}`);
    line.setAttribute('marker-end',a.type==='pass'?'url(#whiteHead)':'url(#yellowHead)');
    line.dataset.id=a.id;
    line.addEventListener('pointerdown',ev=>{ev.stopPropagation();selectedObject=a.id;renderAll()});
    arrowsLayer.appendChild(line);
  });
}
function renderZones(){
  zonesLayer.innerHTML='';
  zones.forEach(z=>{
    const r=document.createElementNS('http://www.w3.org/2000/svg','rect');
    r.setAttribute('x',z.x*pitch.clientWidth);r.setAttribute('y',z.y*pitch.clientHeight);
    r.setAttribute('width',z.width*pitch.clientWidth);r.setAttribute('height',z.height*pitch.clientHeight);
    r.setAttribute('class',`zoneShape ${selectedObject===z.id?'selected':''}`);
    r.addEventListener('pointerdown',e=>{e.stopPropagation();selectedObject=z.id;renderAll()});
    zonesLayer.appendChild(r);
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',(z.x+z.width/2)*pitch.clientWidth);t.setAttribute('y',(z.y+z.height/2)*pitch.clientHeight);
    t.setAttribute('fill','#ffe16a');t.setAttribute('font-size','14');t.setAttribute('font-weight','700');
    t.setAttribute('text-anchor','middle');t.setAttribute('dominant-baseline','middle');t.textContent=z.label;
    t.style.pointerEvents='none';zonesLayer.appendChild(t);
  });
}
function renderLines(){
  linesLayer.innerHTML='';
  lines.forEach(l=>{
    const s=toPx(l.start),e=toPx(l.end);
    const line=document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',s.x);line.setAttribute('y1',s.y);line.setAttribute('x2',e.x);line.setAttribute('y2',e.y);
    line.setAttribute('class',`tacticLine ${selectedObject===l.id?'selected':''}`);
    line.addEventListener('pointerdown',ev=>{ev.stopPropagation();selectedObject=l.id;renderAll()});
    linesLayer.appendChild(line);
  });
}
function renderNotes(){ notesLayer.innerHTML=''; }
function undo(){
  const last=[...arrows,...zones,...lines,...notes].sort((a,b)=>b.id-a.id)[0];
  if(!last)return;
  arrows=arrows.filter(x=>x.id!==last.id);
  zones=zones.filter(x=>x.id!==last.id);
  lines=lines.filter(x=>x.id!==last.id);
  notes=notes.filter(x=>x.id!==last.id);
  selectedObject=null;renderAll();saveLocal();
}
function clearArrows(){arrows=[];selectedObject=null;renderAll();saveLocal()}
function clearBoard(){
  if(!confirm('Clear everything from this briefing? This removes all players, arrows, zones, lines and notes.'))return;
  players=[];arrows=[];zones=[];lines=[];notes=[];
  selectedObject=null;renderPlayers();renderAll();saveLocal();
}
document.addEventListener('keydown',e=>{
  if(e.key==='Delete' && selectedObject!==null){
    arrows=arrows.filter(x=>x.id!==selectedObject);
    zones=zones.filter(x=>x.id!==selectedObject);
    lines=lines.filter(x=>x.id!==selectedObject);
    notes=notes.filter(x=>x.id!==selectedObject);
    selectedObject=null;renderAll();saveLocal();
  }
});
function saveLocal(){
  matchMeta={
    name:document.getElementById('matchName').value,
    date:document.getElementById('matchDate').value,
    minute:document.getElementById('matchMinute').value
  };
  snapshotCurrentScene();
  localStorage.setItem('tacticalPrototype',JSON.stringify({
    players,arrows,zones,lines,notes,nextPlayerId,nextObjectId,scenes,currentSceneId,matchMeta,currentMatchId
  }));
  if(currentMatchId!==null){
    const m=matches.find(x=>x.id===currentMatchId);
    if(m){m.name=matchMeta.name||m.name;m.date=matchMeta.date||'';m.briefings=structuredClone(scenes);persistMatches();}
  }
}
function loadLocal(){
  try{
    const d=JSON.parse(localStorage.getItem('tacticalPrototype')||'null');
    if(d){
      players=d.players||[];arrows=d.arrows||[];zones=d.zones||[];lines=d.lines||[];notes=d.notes||[];
      nextPlayerId=d.nextPlayerId||1;nextObjectId=d.nextObjectId||1;
      scenes=d.scenes||[];currentSceneId=d.currentSceneId??null;matchMeta=d.matchMeta||matchMeta;currentMatchId=d.currentMatchId??null;
    }
  }catch{}
  loadMatchesLibrary();
  if(currentMatchId!==null && matches.some(m=>m.id===currentMatchId)){
    openMatch(currentMatchId);
  }
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
['matchName','matchDate','matchMinute','phaseSelect'].forEach(id=>{
  document.getElementById(id).addEventListener('change',()=>{matchMeta={
    name:document.getElementById('matchName').value,
    date:document.getElementById('matchDate').value,
    minute:document.getElementById('matchMinute').value
  }; if(currentSceneId!==null){const s=scenes.find(x=>x.id===currentSceneId);if(s){s.phase=document.getElementById('phaseSelect').value;s.match={...matchMeta}}} saveLocal();renderSceneBar()});
});
loadLocal();
document.getElementById('landing').style.display='flex';
document.getElementById('boardShell').style.display='none';
</script>
</body>
</html>
