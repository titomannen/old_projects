<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musikbetyg Kalkylator</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

<div id="app">

    <header id="header">
        <h1>Musikbetyg Kalkylator</h1>
    </header>

    <div id="layout">

        <!-- Sidebar: library -->
        <aside id="sidebar">

            <h2>Bibliotek</h2>

            <p id="libraryCount" class="libraryCount">💿 0 album</p>

            <!-- Search, sort and album cards are rendered here by app.js -->
            <div id="results"></div>

        </aside>

        <!-- Workspace -->
        <section id="workspace">

            <!-- Toolbar: add album + backup -->
            <div id="toolbar">

                <input
                    id="artistInput"
                    placeholder="Artist"
                    aria-label="Artist"
                >

                <input
                    id="titleInput"
                    placeholder="Album"
                    aria-label="Album"
                >

                <button
                    id="setAlbumDetails"
                    type="button"
                    class="primaryButton">
                    Hämta album
                </button>

                <div class="toolbarSpacer"></div>

                <button
                    id="backupButton"
                    type="button"
                    class="secondaryButton">
                    💾 Exportera
                </button>

                <label
                    for="importInput"
                    class="secondaryButton backupLabel">
                    📂 Importera
                </label>

                <input
                    id="importInput"
                    type="file"
                    accept=".json"
                    hidden
                >

            </div>

            <!-- Album details -->
            <div id="albumDetails" style="display:none;">

                <div id="albumHero">

                    <img id="detailCover" alt="Albumomslag">

                    <div id="detailInfo">
                        <h2 id="detailTitle"></h2>
                        <p id="detailArtist"></p>
                        <p id="detailYear"></p>
                    </div>

                </div>

                <div id="albumContent">
                    <div id="trackList"></div>
                    <div id="albumStats"></div>
                </div>

                <button
                    id="saveChangesButton"
                    type="button"
                    class="primaryButton">
                    Save Changes
                </button>

                <button
                    id="deleteAlbumButton"
                    type="button"
                    class="secondaryButton">
                    🗑 Remove Album
                </button>

                <div id="saveMessage" role="status" aria-live="polite"></div>

            </div>

        </section>

    </div>

    <!-- Manual album popup -->
    <div id="manualAlbumPopup" class="popup hidden">

        <div class="popupContent">

            <div class="dialogTitle">Create Album Manually</div>

            <div class="popupBody">

                <label for="manualArtist">Artist</label>
                <input id="manualArtist">

                <label for="manualTitle">Album</label>
                <input id="manualTitle">

                <label for="manualYear">Release Year</label>
                <input id="manualYear">

                <label for="manualCover">Cover URL (optional)</label>
                <input id="manualCover">

                <h3>Tracks</h3>

                <div id="manualTrackList"></div>

                <button id="addTrackButton" type="button">
                    + Add Track
                </button>

            </div>

            <div class="popupButtons">

                <button id="cancelManual" type="button">
                    Cancel
                </button>

                <button
                    id="createManualAlbum"
                    type="button"
                    class="primaryButton">
                    Create Album
                </button>

            </div>

        </div>

    </div>

    <!-- Release popup (MusicBrainz results) -->
    <div id="releasePopup" class="popup hidden">

        <div class="popupContent">

            <div class="dialogTitle">Select Album Release</div>

            <div class="popupBody">

                <p>Choose the correct version of the album.</p>

                <div class="releaseLayout">

                    <div id="releaseList"></div>

                    <div id="releasePreview">

                        <img
                            id="releaseCover"
                            src=""
                            alt="Album Cover"
                        >

                        <div id="releaseInfo">

                            <label for="releaseArtist">Artist</label>
                            <input id="releaseArtist">

                            <label for="releaseTitle">Album</label>
                            <input id="releaseTitle">

                            <label for="releaseYear">Release Year</label>
                            <input id="releaseYear">

                            <label for="releaseCoverUrl">Cover URL</label>
                            <input id="releaseCoverUrl">

                            <hr>

                            <p><strong>Country:</strong> <span id="releaseCountry"></span></p>
                            <p><strong>Format:</strong> <span id="releaseFormat"></span></p>

                        </div>

                    </div>

                </div>

            </div>

            <div class="popupButtons">

                <button id="confirmRelease" type="button">
                    Import Album
                </button>

                <button id="cancelRelease" type="button">
                    Cancel
                </button>

            </div>

        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
