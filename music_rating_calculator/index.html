<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music calculator app</title>

  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<h1>Musikbetyg Kalkylator</h1>

<div id="stepContainer">
    <p>Ange artist och album</p>
    <input id="artistInput" placeholder="Artist" />
    <input id="titleInput" placeholder="Album Title" />

    <button id="setAlbumDetails">Hämta album</button>
</div>

<div id="albumTitleContainer" style="display:none;">
    <h2 id="albumTitleDisplay"></h2>
</div>

<div id="ratingsContainer" style="display:none;">
    <div id="ratingInputs"></div>
    <button id="submitRatings">Beräkna Medelbetyg</button>
</div>

<div id="editContainer" style="display:none;">
    <h2 id="editTitle"></h2>
    <div id="editInputs"></div>
    <button id="saveEdit">Spara ändringar</button>
</div>

<div id="releasePopup" class="popup hidden">

    <div class="popupContent">

        <h2>Select Release</h2>

        <p>Choose the correct version of the album.</p>

        <div id="releaseList"></div>

        <div id="releasePreview">

            <img id="releaseCover" src="" alt="Album Cover">

            <div id="releaseInfo">

                <p id="releaseCountry"></p>

                <p id="releaseFormat"></p>

                <p id="releaseLabel"></p>

                <p id="releaseTracks"></p>

                <p id="releaseGenres"></p>

            </div>

        </div>

        <div class="popupButtons">

            <button id="confirmRelease">
                Import Album
            </button>

            <button id="cancelRelease">
                Cancel
            </button>

        </div>

    </div>

</div>

<div id="backupControls">

    <button id="backupButton">
        📦 Exportera backup
    </button>

    <label for="importInput" class="backupLabel">
        📂 Importera backup
    </label>

    <input
        id="importInput"
        type="file"
        accept=".json"
        hidden
    >

</div>

<div id="results"></div>

<script src="app.js"></script>
</body>
</html>
